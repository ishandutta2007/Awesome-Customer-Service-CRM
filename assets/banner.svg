<svg fill="none" viewBox="0 0 800 200" width="100%" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 36px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 18px; fill: #94a3b8; }
    .bg { fill: #0f172a; }
    .card { fill: #1e293b; rx: 12px; opacity: 0.8; }
    .accent { fill: #6366f1; }
    
    @keyframes float1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(-2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }
    .floating-element-1 { animation: float1 6s ease-in-out infinite; transform-origin: center; }
    .floating-element-2 { animation: float2 8s ease-in-out infinite; transform-origin: center; }
    .pulsing-glow { animation: pulse 4s ease-in-out infinite; }
  </style>
  <rect width="800" height="200" class="bg" rx="16"/>
  
  <!-- Dynamic Background Glow & Elements (Behind Text) -->
  <circle cx="150" cy="100" r="120" fill="#4f46e5" class="pulsing-glow" filter="blur(50px)"/>
  <circle cx="650" cy="100" r="100" fill="#06b6d4" class="pulsing-glow" filter="blur(40px)"/>
  
  <!-- Background Animated Cards/Pills (Lower Opacity & Positioned Away from Main Text) -->
  <g class="floating-element-1" opacity="0.4">
    <rect x="580" y="30" width="160" height="40" rx="8" class="card"/>
    <circle cx="600" cy="50" r="8" fill="#10b981"/>
    <rect x="618" y="44" width="80" height="12" rx="4" fill="#475569"/>
  </g>
  
  <g class="floating-element-2" opacity="0.4">
    <rect x="620" y="110" width="150" height="50" rx="8" class="card"/>
    <circle cx="640" cy="135" r="10" fill="#6366f1"/>
    <rect x="660" y="130" width="70" height="10" rx="4" fill="#475569"/>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(50, 85)">
    <text class="header" x="0" y="0">Awesome Customer Service CRM 🎧</text>
    <text class="subtitle" x="0" y="35">Curated List of SaaS Platforms &amp; Open-Source Ticketing / Helpdesk Solutions</text>
  </g>
</svg>
