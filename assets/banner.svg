<svg xmlns="http://www.w3.org/2000/svg" width="100%" fill="none" viewBox="0 0 800 200"><style>@keyframes float1{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(2deg)}}@keyframes float2{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(12px) rotate(-2deg)}}@keyframes pulse{0%{opacity:.3}50%{opacity:.7}}.header,.subtitle{font-family:system-ui,-apple-system,sans-serif;font-weight:800;font-size:36px;fill:#fff}.subtitle{font-weight:500;font-size:18px;fill:#94a3b8}.bg{fill:#0f172a}.card{fill:#1e293b;rx:12px;opacity:.8}.floating-element-1,.floating-element-2{animation:float1 6s ease-in-out infinite;transform-origin:center}.floating-element-2{animation:float2 8s ease-in-out infinite}.pulsing-glow{animation:pulse 4s ease-in-out infinite}</style><rect width="800" height="200" class="bg" rx="16"/><circle cx="150" cy="100" r="120" fill="#4f46e5" class="pulsing-glow" filter="blur(50px)"/><circle cx="650" cy="100" r="100" fill="#06b6d4" class="pulsing-glow" filter="blur(40px)"/><g class="floating-element-1" opacity=".4"><rect width="160" height="40" x="580" y="30" class="card" rx="8"/><circle cx="600" cy="50" r="8" fill="#10b981"/><rect width="80" height="12" x="618" y="44" fill="#475569" rx="4"/></g><g class="floating-element-2" opacity=".4"><rect width="150" height="50" x="620" y="110" class="card" rx="8"/><circle cx="640" cy="135" r="10" fill="#6366f1"/><rect width="70" height="10" x="660" y="130" fill="#475569" rx="4"/></g><g><text x="0" y="0" class="header" transform="translate(50, 85)">Awesome Customer Service CRM 🎧</text><text x="0" y="35" class="subtitle" transform="translate(50, 85)">Curated List of SaaS Platforms &amp; Open-Source Ticketing / Helpdesk Solutions</text></g></svg>